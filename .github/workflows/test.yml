name: Tests

on: [push, pull_request]

jobs:
  python-tests:
    name: Backend Tests & Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx pytest

      - name: Smoke import test
        run: |
          python -c "import src.database, src.plate_detector, src.vehicle_detector, src.camera_manager, src.auto_trigger; print('All core AI modules imported successfully')"

      - name: Run test suite
        run: |
          pytest tests/ -v

  flutter-analyze:
    name: Mobile App Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Analyze mobile_flutter
        run: |
          cd mobile_flutter
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
