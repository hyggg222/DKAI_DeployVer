name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run tests
        # Running check_api_gem.py as a basic smoke test if connection allows, 
        # or just verifying importability. 
        # For now, we list contents to verify structure.
        run: |
          python --version
          ls -R
