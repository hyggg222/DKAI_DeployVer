name: smart_parking_app
description: A new Flutter project for Smart Parking Management.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  socket_io_client: ^2.0.3
  http: ^1.1.0
  cached_network_image: ^3.3.0

  flutter_local_notifications: ^18.0.0
  flutter_background_service: ^5.0.0  # Upgrade for Android 14/AGP 8+ support
  permission_handler: ^11.3.0       # For Notification permission
  intl: ^0.18.1
  image_picker: ^1.0.4
  image: ^4.1.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
